name: Copiar issues com iteration específica para repositório público

on:
  schedule:
    - cron: '*/10 * * * *'  # Executa a cada 10 minutos
  workflow_dispatch:       # Permite execução manual também

jobs:
  sync-iteration:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh jq
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Buscar ID do projeto no repositório pessoal
        id: projeto
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          echo "Buscando ID do projeto no repositório jcorreaviana/user-history-backlog..."

          PROJECT_ID=$(gh api graphql -f query='
          {
            repository(owner: "jcorreaviana", name: "user-history-backlog") {
              projectV2(number: 2) {
                id
              }
            }
          }' --jq '.repository.projectV2.id')

          echo "PROJECT_ID=$PROJECT_ID" >> $GITHUB_ENV

      - name: Buscar issues da iteration "Iteration 1"
        id: buscar
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          echo "Buscando issues com Iteration == 'Iteration 1'..."

          ISSUE_LIST=$(gh api graphql -f query='
          {
            repository(owner: "jcorreaviana", name: "user-history-backlog") {
              projectV2(number: 2) {
                items(first: 100) {
                  nodes {
                    content {
                      ... on Issue {
                        title
                        body
                        number
                      }
                    }
                    fieldValues(first: 10) {
                      nodes {
                        ... on ProjectV2ItemFieldIterationValue {
                          title
                        }
                      }
                    }
                  }
                }
              }
            }
          }' --jq '.repository.projectV2.items.nodes[] | select(.fieldValues.nodes[].title == "Iteration 1") | .content')

          echo "$ISSUE_LIST" > issues.json

      - name: Criar issues no repositório público
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          if [ ! -s issues.json ]; then
            echo "⚠️ Nenhuma issue com Iteration 1 encontrada."
            exit 0
          fi

          cat issues.json | jq -c '.' | while read -r issue; do
            TITLE=$(echo "$issue" | jq -r '.title')
            BODY=$(echo "$issue" | jq -r '.body')

            echo "Criando issue pública: $TITLE"

            curl -s -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/jcorreaviana/challenge-elastic/issues \
              -d "{
                \"title\": \"$TITLE\",
                \"body\": \"$BODY\"
              }"
          done
