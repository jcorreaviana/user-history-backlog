name: Copiar issues com iteration específica para repositório público

on:
  schedule:
    - cron: '*/10 * * * *'  # Executa a cada 10 minutos
  workflow_dispatch:

jobs:
  sync-iteration:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh jq
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Buscar ID do projeto no repositório pessoal
        id: projeto
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          PROJECT_ID=$(gh api graphql -f query='
          {
            repository(owner: "jcorreaviana", name: "user-history-backlog") {
              projectV2(number: 2) {
                id
              }
            }
          }' --jq '.repository.projectV2.id')
          echo "PROJECT_ID=$PROJECT_ID" >> $GITHUB_ENV

      - name: Buscar issues da iteration "Iteration 1"
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          echo "Buscando issues com Iteration == 'Iteration 1' que ainda não foram replicadas..."

          gh api graphql -f query='
          {
            repository(owner: "jcorreaviana", name: "user-history-backlog") {
              projectV2(number: 2) {
                items(first: 100) {
                  nodes {
                    content {
                      ... on Issue {
                        title
                        body
                        number
                        labels(first: 10) {
                          nodes {
                            name
                          }
                        }
                      }
                    }
                    fieldValues(first: 10) {
                      nodes {
                        ... on ProjectV2ItemFieldIterationValue {
                          title
                        }
                      }
                    }
                  }
                }
              }
            }
          }' --jq '
          .repository.projectV2.items.nodes[]
          | select(
              (.fieldValues.nodes[].title == "Iteration 1")
              and (.content.labels.nodes[].name | index("replicado-publico") | not)
            )
          | .content' > issues.json

      - name: Criar issues no repositório público e marcar como replicadas
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          if [ ! -s issues.json ]; then
            echo "⚠️ Nenhuma issue nova para replicar."
            exit 0
          fi

          cat issues.json | jq -c '.' | while read -r issue; do
            TITLE=$(echo "$issue" | jq -r '.title')
            BODY=$(echo "$issue" | jq -r '.body')
            NUMBER=$(echo "$issue" | jq -r '.number')

            echo "📤 Criando issue pública: $TITLE"

            RESPONSE=$(curl -s -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/jcorreaviana/challenge-elastic/issues \
              -d "{
                \"title\": \"$TITLE\",
                \"body\": \"$BODY\"
              }")

            # Marcar issue original como replicada
            echo "🏷️ Adicionando label 'replicado-publico' à issue #$NUMBER"
            curl -s -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/jcorreaviana/user-history-backlog/issues/$NUMBER/labels \
              -d '["replicado-publico"]'
          done
