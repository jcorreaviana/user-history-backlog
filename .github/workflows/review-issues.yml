name: Review Issues with StackSpot AI
on:
  issues:
    types: [opened, edited]

jobs:
  review-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Call StackSpot AI Quick Command to review issue
        env:
          STACKSPOT_TOKEN: ${{ secrets.STACKSPOT_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          curl -X POST "https://api.stackspot.com/quick-command/review-issue" \
            -H "Authorization: Bearer $STACKSPOT_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
                  "title": "'"$ISSUE_TITLE"'",
                  "body": "'"$ISSUE_BODY"'"
                }'
