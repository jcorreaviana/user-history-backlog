name: Review Issues with StackSpot AI

on:
  issues:
    types: [opened, edited]

jobs:
  review-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install STK CLI
        run: |
          pip install stackspot-cli

      - name: Login to StackSpot
        env:
          STACKSPOT_PAT: ${{ secrets.STACKSPOT_PAT }}
        run: |
          stk login --token $STACKSPOT_PAT

      - name: Call StackSpot AI Quick Command to review issue
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          stk quick-command run review-issue \
            --input "title=$ISSUE_TITLE" \
            --input "body=$ISSUE_BODY"
