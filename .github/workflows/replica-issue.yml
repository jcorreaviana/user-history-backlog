name: Replicar issue para repositório público via agente

on:
  issues:
    types: [labeled]

jobs:
  replicate-issue:
    if: github.event.label.name == 'pronto-para-publicar'
    runs-on: ubuntu-latest
    steps:
      - name: Verificar se a issue tem o label correto
        if: contains(github.event.issue.labels.*.name, 'pronto-para-publicar')
        run: echo "Issue tem o label correto, processando..."

      - name: Obter resposta do agente
        id: agent
        env:
          REALM: ${{ secrets.STK_REALM }}
          CLIENT_ID: ${{ secrets.STK_CLIENT_ID }}
          CLIENT_KEY: ${{ secrets.STK_CLIENT_SECRET }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          # Autentica e obtém JWT
          JWT=$(curl -s "https://idm.stackspot.com/$REALM/oidc/oauth/token" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            -d 'grant_type=client_credentials' \
            -d "client_id=$CLIENT_ID" \
            -d "client_secret=$CLIENT_KEY" | jq -r '.access_token')
          if [ -z "$JWT" ] || [ "$JWT" == "null" ]; then
            echo "::error::Falha ao obter JWT"
            exit 1
          fi

          # Monta prompt e payload
          PROMPT="Título: $ISSUE_TITLE\n\nDescrição: $ISSUE_BODY"
          JSON_PAYLOAD=$(jq -n \
            --arg prompt "$PROMPT" \
            '{streaming: false, user_prompt: $prompt, stackspot_knowledge: false, return_ks_in_response: true}')

          # Chama o agente
          AGENT_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}\n" \
            'https://genai-inference-app.stackspot.com/v1/agent/01K0J15ZV6D3X08834CYXXS0XF/chat' \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $JWT" \
            -d "$JSON_PAYLOAD")
          AGENT_BODY=$(echo "$AGENT_RESPONSE" | sed '/HTTP_STATUS/d')

          # Extrai e limpa o JSON retornado
          RAW_MESSAGE=$(echo "$AGENT_BODY" | jq -r '.message // empty')
          CLEAN_JSON=$(echo "$RAW_MESSAGE" | sed -e '1s/^```json//' -e '$s/```$//' | sed '/^$/d')

          # Extrai title e body
          RESULT_TITLE=$(echo "$CLEAN_JSON" | jq -r '.title // "Título não encontrado"')
          RESULT_BODY=$(echo "$CLEAN_JSON" | jq -r '.body // "Corpo não encontrado"')

          echo "result_title<<EOF" >> $GITHUB_OUTPUT
          echo "$RESULT_TITLE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "result_body<<EOF" >> $GITHUB_OUTPUT
          echo "$RESULT_BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Criar issue no repositório público
        id: create_public_issue
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          TITLE: ${{ steps.agent.outputs.result_title }}
          BODY: ${{ steps.agent.outputs.result_body }}
        run: |
          ISSUE_JSON=$(jq -n \
            --arg title "$TITLE" \
            --arg body "$BODY" \
            '{title: $title, body: $body}')
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/jcorreaviana/challenge-elastic/issues \
            -d "$ISSUE_JSON")
          ISSUE_NUMBER=$(echo "$RESPONSE" | jq -r '.number')
          echo "public_issue_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT

      - name: Relacionar issue original como parent
        if: steps.create_public_issue.outputs.public_issue_number != ''
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          # Número da issue original (parent)
          PARENT_ISSUE_NUMBER=${{ github.event.issue.number }}
          # Número da nova issue (child)
          CHILD_ISSUE_NUMBER=${{ steps.create_public_issue.outputs.public_issue_number }}

          # Cria a relação parent/child (pode ser necessário habilitar a feature de "issue relationships" no repo)
          curl -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/jcorreaviana/challenge-elastic/issues/$CHILD_ISSUE_NUMBER/relationships/parent \
            -d "{\"parent\":{\"repository\":\"${{ github.repository }}\",\"number\":$PARENT_ISSUE_NUMBER}}"
