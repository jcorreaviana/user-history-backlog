name: Replicar issue para repositório público via agente

on:
  issues:
    types: [labeled]

jobs:
  replicate-issue:
    if: github.event.label.name == 'pronto-para-publicar'
    runs-on: ubuntu-latest
    steps:
      - name: Verificar se a issue tem o label correto
        if: contains(github.event.issue.labels.*.name, 'pronto-para-publicar')
        run: echo "Issue tem o label correto, processando..."

      - name: Obter resposta do agente
        id: agent
        env:
          REALM: ${{ secrets.STK_REALM }}
          CLIENT_ID: ${{ secrets.STK_CLIENT_ID }}
          CLIENT_KEY: ${{ secrets.STK_CLIENT_SECRET }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -x  # Ativa debug do shell

          # Autentica e obtém JWT
          JWT=$(curl -s "https://idm.stackspot.com/$REALM/oidc/oauth/token" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            -d 'grant_type=client_credentials' \
            -d "client_id=$CLIENT_ID" \
            -d "client_secret=$CLIENT_KEY" | jq -r '.access_token')

          if [ -z "$JWT" ] || [ "$JWT" == "null" ]; then
            echo "::error::Falha ao obter JWT"
            exit 1
          fi
          echo "JWT obtido: ${JWT:0:10}..."

          # Monta prompt para o agente
          PROMPT="Título: $ISSUE_TITLE\n\nDescrição: $ISSUE_BODY"
          echo "Prompt enviado ao agente:"
          echo "$PROMPT"

          # Monta JSON com jq para evitar problemas de escape
          JSON_PAYLOAD=$(jq -n \
            --arg prompt "$PROMPT" \
            '{streaming: false, user_prompt: $prompt, stackspot_knowledge: false, return_ks_in_response: true}')

          echo "Payload enviado ao agente:"
          echo "$JSON_PAYLOAD"

          # Chama o agente
          AGENT_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}\n" \
            'https://genai-inference-app.stackspot.com/v1/agent/01K0J15ZV6D3X08834CYXXS0XF/chat' \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $JWT" \
            -d "$JSON_PAYLOAD")

          # Separa status HTTP e corpo
          HTTP_STATUS=$(echo "$AGENT_RESPONSE" | grep HTTP_STATUS | cut -d':' -f2)
          AGENT_BODY=$(echo "$AGENT_RESPONSE" | sed '/HTTP_STATUS/d')

          echo "Status HTTP do agente: $HTTP_STATUS"
          echo "Resposta bruta do agente:"
          echo "$AGENT_BODY"

          # Extrai resultado (ajuste conforme o formato do retorno do agente)
          RESULT_TITLE=$(echo "$AGENT_BODY" | jq -r '.result.title // "Título não encontrado"')
          RESULT_BODY=$(echo "$AGENT_BODY" | jq -r '.result.body // .result // "Corpo não encontrado"')

          echo "Título extraído: $RESULT_TITLE"
          echo "Corpo extraído: $RESULT_BODY"

          echo "result_title<<EOF" >> $GITHUB_OUTPUT
          echo "$RESULT_TITLE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "result_body<<EOF" >> $GITHUB_OUTPUT
          echo "$RESULT_BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Criar issue no repositório público
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          TITLE: ${{ steps.agent.outputs.result_title }}
          BODY: ${{ steps.agent.outputs.result_body }}
        run: |
          # Monta o JSON de forma segura com jq
          ISSUE_JSON=$(jq -n \
            --arg title "$TITLE" \
            --arg body "$BODY" \
            '{title: $title, body: $body}')

          echo "Payload enviado para o GitHub:"
          echo "$ISSUE_JSON"

          curl -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/jcorreaviana/challenge-elastic/issues \
            -d "$ISSUE_JSON"
